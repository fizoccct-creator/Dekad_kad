services:
  - type: web
    name: dekad-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ROUTELLM_API_KEY
        sync: false
      - key: ROUTELLM_BASE_URL
        value: https://routellm.abacus.ai/v1
      - key: MODEL_NAME
        value: gpt-4.1-mini
